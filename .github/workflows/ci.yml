name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ragapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Dummy values: the tests fake OpenAI, run Qdrant in memory and never call Google.
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ragapp
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ragapp_test
      QDRANT_URL: http://localhost:6333
      QDRANT_API_KEY: ci-dummy-key
      OPENAI_API_KEY: ci-dummy-key
      JWT_SECRET_KEY: ci-only-jwt-secret-key-0123456789abcdef0123
      SESSION_SECRET_KEY: ci-only-session-secret-0123456789abcdef01
      GOOGLE_CLIENT_ID: ci-client-id
      GOOGLE_CLIENT_SECRET: ci-client-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,s3]"

      - name: Create test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE ragapp_test;"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Migrations match the models
        run: |
          alembic upgrade head
          alembic check

      - name: Tests
        run: python -m pytest -q